/* ===== PHÒNG MKT – giao diện (đợt 1, 28/11/2026) =====
   Dùng chung cho tab "📣 Phòng MKT" trong app báo cáo (anh) và trang riêng mkt.html (nhân viên – KHÔNG chứa số liệu kinh doanh).
   Mọi dữ liệu lấy từ máy chủ Apps Script (window.MKT_URL); quyền kiểm tra ở máy chủ, giao diện chỉ ẩn/hiện cho gọn. */
(function () {
  const VAI = { admin: 'Quản lý', lead: 'Trưởng nhóm – Web & sàn', content: 'Nội dung – TikTok Đông Anh', crew: 'Quay dựng – TikTok Studio' };
  const TIEN_DO = ['Chưa quay', 'Đã quay', 'Đang dựng', 'Chờ duyệt', 'Đã đăng'];
  const LOAI_PHIEU = ['Đổi ca', 'Nghỉ phép', 'Dời lịch quay', 'Đề xuất ngân sách/đạo cụ', 'Khác'];
  const THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const SAP_CO = ['Kế hoạch nội dung', 'Web & Sàn', 'Tồn & đẩy tồn', 'Trợ lý AI', 'Báo cáo tuần', 'KPI'];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAY = 864e5, vnNow = () => new Date(Date.now() + 7 * 36e5), ymd = d => d.toISOString().slice(0, 10);
  const pY = s => { const a = s.split('-').map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2])); };
  const addD = (s, n) => ymd(new Date(pY(s).getTime() + n * DAY));
  const monOf = s => addD(s, -((pY(s).getUTCDay() + 6) % 7));
  const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
  const thu = s => THU[pY(s).getUTCDay()];
  const gio = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }); };
  const nho = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
  const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } };
  const chip = (t, k) => `<span class="mk-c mk-${k || 'n'}">${esc(t)}</span>`;
  const so = v => v == null ? '—' : Number(v).toLocaleString('vi-VN');
  const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/@([a-z0-9._]+)/gi, '<b class="mk-at">@$1</b>');

  const S = { tok: null, me: null, nguoi: [], tab: 'tq', root: null, ver: 0, chatId: 0, chatTin: [], tuan: null, wkLich: null, wkQuay: null, goiy: null, loc: 'all', moPhieu: {}, thongBao: [], hen: null, tong: {}, banNhap: null };
  const url = () => window.MKT_URL;

  async function api(a, o) {
    const body = Object.assign({ a: a, t: S.tok }, o || {});
    let j;
    try { j = await fetch(url(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json()); }
    catch (e) { throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
    if (!j.ok) { const e = new Error(j.loi || 'Lỗi'); if (/Phiên hết hạn|Chưa đăng nhập|đã bị khóa/.test(e.message) && a !== 'login') { dangXuatLocal(e.message); } throw e; }
    return j;
  }
  function dangXuatLocal(msg) { S.tok = null; S.me = null; S.wkLich = S.wkQuay = S.goiy = S.tuan = S.banNhap = null; S.moPhieu = {}; S.chatTin = []; S.chatId = 0; S.tab = 'tq'; S.ver = 0; nho('dbl-mkt-tok', null); ss('dbl-mkt-tok', null); clearInterval(S.hen); veDangNhap(msg); }

  /* ---------- CSS ---------- */
  function css() {
    if (document.getElementById('mk-css')) return;
    const st = document.createElement('style'); st.id = 'mk-css';
    st.textContent = `

  async function lam(btn, f, okMsg) {
    const t = btn && btn.textContent; if (btn) btn.disabled = true;

  function tienDoTuan(q) {

      <div class="mk-card"><h3>🛡️ Phân quyền (kiểm tra ở máy chủ)</h3><div class="mk-wrap"><table style="font-size:13px"><tr><th>Mục</th><th>Anh</th><th>Hòa Lương</th><th>Quang Huy</th><th>Thành Long</th></tr>
      <tr><td>Tổng quan, Trao đổi, bình luận</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr>

      <tr><td>Gợi ý SP / Lịch quay SP</td><td>Duyệt lịch tuần</td><td>Xem</td><td>Lập, gửi duyệt</td><td>Xem · cập nhật tiến độ</td></tr>
